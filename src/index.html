<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/rxjs/dist/bundles/rxjs.umd.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@univerjs/presets/lib/umd/index.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-core/lib/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-core/lib/umd/locales/vi-VN.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-drawing/lib/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-drawing/lib/umd/locales/vi-VN.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-hyper-link/lib/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-hyper-link/lib/umd/locales/vi-VN.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-conditional-formatting/lib/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-conditional-formatting/lib/umd/locales/vi-VN.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-filter/lib/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-filter/lib/umd/locales/vi-VN.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-thread-comment/lib/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-thread-comment/lib/umd/locales/vi-VN.js"></script>

    <script src="luckyexcel.umd.js"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-core/lib/index.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-drawing/lib/index.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-hyper-link/lib/index.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-conditional-formatting/lib/index.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-filter/lib/index.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-thread-comment/lib/index.css"
    />
  </head>
  <body>
    <div
      id="lucky-mask-demo"
      style="
        position: absolute;
        z-index: 1000000;
        left: 0px;
        top: 0px;
        bottom: 0px;
        right: 0px;
        background: rgba(255, 255, 255, 0.8);
        text-align: center;
        font-size: 40px;
        align-items: center;
        justify-content: center;
        display: none;
      "
    >
      Downloading
    </div>
    <p style="text-align: center">
      <input
        style="font-size: 16px"
        type="file"
        id="Luckyexcel-demo-file"
        name="Luckyexcel-demo-file"
      />
      Or Load remote xlsx file:
      <select
        style="height: 27px; top: -2px; position: relative"
        id="Luckyexcel-select-demo"
      >
        <option value="">select a demo</option>
        <option
          value="https://minio.cnbabylon.com/public/luckysheet/money-manager-2.xlsx"
        >
          Money Manager.xlsx
        </option>
        <option
          value="https://minio.cnbabylon.com/public/luckysheet/Activity%20costs%20tracker.xlsx"
        >
          Activity costs tracker.xlsx
        </option>
        <option
          value="https://minio.cnbabylon.com/public/luckysheet/House%20cleaning%20checklist.xlsx"
        >
          House cleaning checklist.xlsx
        </option>
        <option
          value="https://minio.cnbabylon.com/public/luckysheet/Student%20assignment%20planner.xlsx"
        >
          Student assignment planner.xlsx
        </option>
        <option
          value="https://minio.cnbabylon.com/public/luckysheet/Credit%20card%20tracker.xlsx"
        >
          Credit card tracker.xlsx
        </option>
        <option
          value="https://minio.cnbabylon.com/public/luckysheet/Blue%20timesheet.xlsx"
        >
          Blue timesheet.xlsx
        </option>
        <option
          value="https://minio.cnbabylon.com/public/luckysheet/Student%20calendar%20%28Mon%29.xlsx"
        >
          Student calendar (Mon).xlsx
        </option>
        <option
          value="https://minio.cnbabylon.com/public/luckysheet/Blue%20mileage%20and%20expense%20report.xlsx"
        >
          Blue mileage and expense report.xlsx
        </option>
      </select>
      <a href="javascript:void(0)" id="Luckyexcel-downlod-file"
        >Download source xlsx file</a
      >
    </p>
    <div
      id="luckysheet"
      style="
        margin: 0px;
        padding: 0px;
        position: absolute;
        width: 100%;
        left: 0px;
        top: 50px;
        bottom: 0px;
        outline: none;
      "
    ></div>
    <script>
      const { createUniver } = UniverPresets;
      const {
        LocaleType,
        merge,
        Disposable,
        setDependencies,
        ICommandService,
        IConfigService,
        CommandType,
        Plugin,
        UniverInstanceType,
        Injector,
      } = UniverCore;
      const {
        IMenuManagerService,
        ComponentManager,
        IShortcutService,
        MetaKeys,
        KeyCode,
        MenuItemType,
        RibbonStartGroup,
      } = UniverUi;
      const { defaultTheme } = UniverDesign;
      const { UniverSheetsCorePreset } = UniverPresetSheetsCore;
      const { UniverSheetsDrawingPreset } = UniverPresetSheetsDrawing;
      const { UniverSheetsHyperLinkPreset } = UniverPresetSheetsHyperLink;
      const { UniverSheetsConditionalFormattingPreset } =
        UniverPresetSheetsConditionalFormatting;
      const { UniverSheetsFilterPreset } = UniverPresetSheetsFilter;
      const { UniverSheetsThreadCommentPreset } =
        UniverPresetSheetsThreadComment;

      const CUSTOM_PLUGIN_CONFIG = 'CUSTOM_PLUGIN_CONFIG';

      class CustomMenuController extends Disposable {
        constructor(
          _commandService,
          _menuMangerService,
          _componentManager,
          _shortcutService,
          _configService
        ) {
          super();

          this._commandService = _commandService;
          this._menuMangerService = _menuMangerService;
          this._componentManager = _componentManager;
          this._shortcutService = _shortcutService;
          this._configService = _configService;

          this._init();
        }

        _init() {
          const config = this._configService.getConfig(CUSTOM_PLUGIN_CONFIG);
          const { menu } = config || {};
          menu.forEach((item, index) => {
            if (item.operation) {
              this.disposeWithMe(
                this._commandService.registerCommand(item.operation)
              ); // register command
            }
            if (item.shortcut) {
              this.disposeWithMe(
                this._shortcutService.registerShortcut(item.shortcut)
              ); // register shortcut
            }
            if (item.icon) {
              this.disposeWithMe(
                this._componentManager.register(
                  item.icon.name,
                  item.icon.component
                )
              ); // register icon component
            }

            if (item.menu) {
              this._menuMangerService.mergeMenu({
                [RibbonStartGroup.HISTORY]: {
                  [item.menu().id]: {
                    order: -((menu.length || 0) - index) - 2,
                    menuItemFactory: item.menu,
                  },
                },
              });
            }
          });
        }
      }

      setDependencies(CustomMenuController, [
        ICommandService,
        IMenuManagerService,
        ComponentManager,
        IShortcutService,
        IConfigService,
      ]);

      const AllCustomController = [CustomMenuController];

      const OperationId = 'custom-menu.operation.save';
      const SaveButtonOperation = (config) => ({
        id: OperationId,
        type: CommandType.OPERATION,
        handler: async () => {
          config?.after?.();
          return true;
        },
      });

      const SaveShortcutItem = {
        id: OperationId,
        description: 'shortcut.save',
        group: '1_common-edit',
        binding: MetaKeys.CTRL_COMMAND | KeyCode.S,
      };

      function CustomMenuItemSaveButtonFactory(accessor) {
        return {
          id: OperationId,
          type: MenuItemType.BUTTON,
          icon: 'SaveSingle',
          tooltip: 'customMenu.save',
          title: 'customMenu.save',
        };
      }

      const FullscreenSingle = () => {
        return React.createElement(
          'svg',
          {
            xmlns: 'http://www.w3.org/2000/svg',
            width: '1em',
            height: '1em',
            viewBox: '0 0 24 24',
          },
          React.createElement('path', {
            fill: 'currentColor',
            d: 'M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12S6.477 2 12 2m.16 14a6.981 6.981 0 0 0-5.147 2.256A7.966 7.966 0 0 0 12 20a7.97 7.97 0 0 0 5.167-1.892A6.979 6.979 0 0 0 12.16 16M12 4a8 8 0 0 0-6.384 12.821A8.975 8.975 0 0 1 12.16 14a8.972 8.972 0 0 1 6.362 2.634A8 8 0 0 0 12 4m0 1a4 4 0 1 1 0 8a4 4 0 0 1 0-8m0 2a2 2 0 1 0 0 4a2 2 0 0 0 0-4',
          })
        );
      };

      const CustomSaveMenu = (config) => ({
        id: OperationId,
        operation: SaveButtonOperation(config),
        shortcut: SaveShortcutItem,
        menu: CustomMenuItemSaveButtonFactory,
        icon: { name: 'SaveSingle', component: FullscreenSingle },
      });

      const config = {
        menu: [
          CustomSaveMenu({
            after: () => {
              const saveData = getUniverSnapshot();
              console.log(saveData);
            },
          }),
        ],
      };

      class UniverSheetsCustomMenuPlugin extends Plugin {
        static type = UniverInstanceType.UNIVER_SHEET;
        static pluginName = CUSTOM_PLUGIN_CONFIG;

        constructor(_injector, _configService) {
          super();

          this._injector = _injector;
          this._configService = _configService;

          this._configService.setConfig(CUSTOM_PLUGIN_CONFIG, config);
        }

        onReady() {
          AllCustomController.forEach((d) => this._injector.get(d));
        }

        onStarting() {
          [AllCustomController].forEach((d) => this._injector.add(d));
        }
      }

      setDependencies(UniverSheetsCustomMenuPlugin, [Injector, IConfigService]);

      const { univerAPI } = createUniver({
        locale: LocaleType.VI_VN,
        locales: {
          [LocaleType.VI_VN]: merge(
            {},
            UniverPresetSheetsCoreViVN,
            UniverPresetSheetsDrawingViVN,
            UniverPresetSheetsHyperLinkViVN,
            UniverPresetSheetsConditionalFormattingViVN,
            UniverPresetSheetsFilterViVN,
            UniverPresetSheetsThreadCommentViVN
          ),
        },
        theme: defaultTheme,
        presets: [
          UniverSheetsCorePreset({
            container: 'luckysheet',
          }),
          UniverSheetsDrawingPreset(),
          UniverSheetsHyperLinkPreset(),
          UniverSheetsConditionalFormattingPreset(),
          UniverSheetsFilterPreset(),
          UniverSheetsThreadCommentPreset(),
        ],
        plugins: [UniverSheetsCustomMenuPlugin],
      });

      univerAPI.createUniverSheet({});

      const getUniverSnapshot = () => {
        const activeWorkbook = univerAPI?.getActiveWorkbook();
        if (!activeWorkbook) {
          throw new Error('Workbook is not initialized');
        }
        return activeWorkbook.save();
      };

      const upload = document.getElementById('Luckyexcel-demo-file');
      const selectADemo = document.getElementById('Luckyexcel-select-demo');
      const downlodDemo = document.getElementById('Luckyexcel-downlod-file');
      const mask = document.getElementById('lucky-mask-demo');
      if (upload) {
        upload.addEventListener('change', (evt) => {
          const files = evt.target.files;
          if (files == null || files.length == 0) {
            alert('No files wait for import');
            return;
          }

          const name = files[0].name;
          const suffixArr = name.split('.');
          const suffix = suffixArr[suffixArr.length - 1];
          if (suffix != 'xlsx') {
            alert('Currently only supports the import of xlsx files');
            return;
          }
          LuckyExcel.transformExcelToUniver(files[0], (exportJson) => {
            if (exportJson.sheets == null || exportJson.sheets.length == 0) {
              alert(
                'Failed to read the content of the excel file, currently does not support xls files!'
              );
              return;
            }

            const saveData = getUniverSnapshot();
            const unitId = saveData.id;
            if (unitId) {
              univerAPI.disposeUnit(saveData.unitId);
            }

            univerAPI.createUniverSheet(exportJson || {});
          });
        });

        selectADemo.addEventListener('change', async (evt) => {
          const obj = selectADemo;
          const index = obj.selectedIndex;
          const value = obj.options[index].value;
          const name = obj.options[index].innerText.trim();
          if (value == '') {
            return;
          }
          mask.style.display = 'flex';

          const response = await fetch(value);
          const blob = await response.blob();
          const file = new File([blob], name);

          LuckyExcel.transformExcelToUniver(file, (exportJson) => {
            if (exportJson.sheets == null || exportJson.sheets.length == 0) {
              alert(
                'Failed to read the content of the excel file, currently does not support xls files!'
              );
              return;
            }
            console.log(exportJson);
            mask.style.display = 'none';

            const saveData = getUniverSnapshot();
            const unitId = saveData.id;
            if (unitId) {
              univerAPI.disposeUnit(saveData.unitId);
            }

            univerAPI.createUniverSheet(exportJson || {});
          });
        });

        downlodDemo.addEventListener('click', function (evt) {
          const obj = selectADemo;
          const index = obj.selectedIndex;
          const value = obj.options[index].value;

          if (value.length == 0) {
            alert('Please select a demo file');
            return;
          }

          let elemIF = document.getElementById('Lucky-download-frame');
          if (elemIF == null) {
            elemIF = document.createElement('iframe');
            elemIF.style.display = 'none';
            elemIF.id = 'Lucky-download-frame';
            document.body.appendChild(elemIF);
          }
          elemIF.src = value;
        });
      }
    </script>
  </body>
</html>
